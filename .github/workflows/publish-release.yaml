name: Build draft release

on:
  workflow_dispatch:

concurrency:
  group: fckcensor-release
  cancel-in-progress: false

jobs:
  build:
    runs-on: windows-2025
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24

      - name: Install dependencies
        run: corepack yarn@1.22.22 install --frozen-lockfile --non-interactive

      - name: Check TypeScript
        run: corepack yarn@1.22.22 typecheck

      - name: Build addon
        run: |
          $env:PULSESYNC_ADDON_OUT_DIR = Join-Path $env:RUNNER_TEMP 'fckcensor-package'
          corepack yarn@1.22.22 build
          if ($LASTEXITCODE -ne 0) { throw 'Addon build failed.' }

      - name: Package addon and prepare release notes
        run: |
          $directory = Join-Path $env:RUNNER_TEMP 'fckcensor-package'
          $metadata = Get-Content -Raw -LiteralPath (Join-Path $directory 'metadata.json') | ConvertFrom-Json
          $package = Get-Content -Raw -LiteralPath 'package.json' | ConvertFrom-Json
          $version = $metadata.version
          if ($version -notmatch '^\d+\.\d+\.\d+$' -or $version -ne $package.version -or $metadata.type -ne 'web-addon') {
            throw 'Invalid addon metadata or mismatched package version.'
          }
          if ($metadata.script -ne 'script.js' -or -not (Test-Path -LiteralPath (Join-Path $directory 'script.js') -PathType Leaf)) {
            throw 'Addon entry point script.js is missing.'
          }
          if ($metadata.css -and -not (Test-Path -LiteralPath (Join-Path $directory $metadata.css) -PathType Leaf)) {
            throw 'Addon stylesheet is missing.'
          }

          $headings = (Get-Content -Raw -LiteralPath 'CHANGELOG.md') -split '(?m)^# '
          $title, $notes = $headings[1] -split '\r?\n', 2
          if (-not $notes -or $title -notmatch "\bv$([regex]::Escape($version))$") {
            throw "CHANGELOG.md must start with an entry for v$version."
          }
          $notesPath = Join-Path $env:RUNNER_TEMP 'fckcensor-release-notes.md'
          $notes.Trim() | Set-Content -LiteralPath $notesPath -Encoding utf8

          Add-Type -AssemblyName System.IO.Compression.FileSystem
          $archive = Join-Path $env:RUNNER_TEMP "FckCensor-$version.pext"
          [IO.Compression.ZipFile]::CreateFromDirectory($directory, $archive, [IO.Compression.CompressionLevel]::Optimal, $false)
          $zip = [IO.Compression.ZipFile]::OpenRead($archive)
          try {
            if (-not $zip.GetEntry('metadata.json') -or -not $zip.GetEntry('script.js')) {
              throw 'Missing addon files at the root of the .pext archive.'
            }
          } finally {
            $zip.Dispose()
          }
          "RELEASE_TAG=v$version" >> $env:GITHUB_ENV
          "RELEASE_ASSET=$archive" >> $env:GITHUB_ENV
          "RELEASE_NOTES=$notesPath" >> $env:GITHUB_ENV

      - name: Create GitHub release draft
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $release = gh release create $env:RELEASE_TAG $env:RELEASE_ASSET --repo $env:GITHUB_REPOSITORY --target $env:GITHUB_SHA --title "FckCensor $env:RELEASE_TAG" --notes-file $env:RELEASE_NOTES --draft
          if ($LASTEXITCODE -ne 0) { throw 'Could not create the release draft.' }
          "[Черновик релиза]($release)" >> $env:GITHUB_STEP_SUMMARY
